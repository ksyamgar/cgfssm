    <!-- Dynamic Social Share Origin Resolver -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location) {
          try {
            var origin = window.location.origin;
            var ogImgs = document.querySelectorAll('meta[property^="og:image"]');
            ogImgs.forEach(function(meta) {
              var content = meta.getAttribute('content');
              if (content && content.startsWith('/') && !content.startsWith('//')) {
                meta.setAttribute('content', origin + content);
              }
            });
            var twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg) {
              var twContent = twImg.getAttribute('content');
              if (twContent && twContent.startsWith('/') && !twContent.startsWith('//')) {
                twImg.setAttribute('content', origin + twContent);
              }
            }
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
              ogUrl.setAttribute('content', window.location.href);
            }
          } catch(e) {}
        }
      })();
    </script>
